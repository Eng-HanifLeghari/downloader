{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Downloader</title>
  <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    input, select, button {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .message, .progress, .download-link {
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
    }
    .download-link a {
      background-color: #008CBA;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Video Downloader</h1>
  <form id="downloadForm">
    {% csrf_token %}
    <label for="url">Video URL:</label>
    <input type="text" id="url" name="url" placeholder="Enter video URL" required>

    <label for="media_type">Download As:</label>
    <select id="media_type" name="media_type">
      <option value="video">Video</option>
      <option value="audio">Audio</option>
    </select>

    <button type="submit" id="downloadBtn">Download</button>
  </form>

  <div class="message" id="message"></div>
  <div class="progress" id="progress"></div>
  <div class="download-link" id="downloadLink"></div>
</div>

<script>
const form = document.getElementById('downloadForm');
const messageDiv = document.getElementById('message');
const progressDiv = document.getElementById('progress');
const downloadLinkDiv = document.getElementById('downloadLink');
const downloadBtn = document.getElementById('downloadBtn');

form.addEventListener('submit', async function(event) {
  event.preventDefault();

  const url = document.getElementById('url').value.trim();
  const media_type = document.getElementById('media_type').value;

  messageDiv.innerHTML = '';
  progressDiv.innerHTML = '⏳ Downloading...';
  downloadLinkDiv.innerHTML = '';
  downloadBtn.disabled = true;
  downloadBtn.textContent = 'Processing...';

  try {
    const response = await fetch('{% url "start_download" %}', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
      },
      body: JSON.stringify({ url: url, media_type: media_type })
    });

    const data = await response.json();

    if (!response.ok || data.status !== 'success') {
      messageDiv.innerHTML = `<p style="color:red;">❌ ${data.error || 'Download failed.'}</p>`;
    } else {
      messageDiv.innerHTML = `<p style="color:green;">✅ ${data.title} ready!</p>`;
      downloadLinkDiv.innerHTML = `
        <a href="${data.download_url}" download="${data.title}.${data.ext}">
          Click to Download (${data.ext})
        </a>`;
    }
  } catch (error) {
    messageDiv.innerHTML = `<p style="color:red;">⚠️ Error: ${error.message}</p>`;
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Download';
    progressDiv.innerHTML = '';
  }
});
</script>
</body>
</html>
